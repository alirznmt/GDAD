seed: 42
data:
  window_size: 128
  stride: 64
  train_ratio: 0.85
model:
  hidden_dim: 64
  num_layers: 4
  kernel_size: 5
  time_dim: 128
  node_dim: 32
  top_k: 5
  dynamic_graph: true
  groups: 8
diffusion:
  timesteps: 200
  schedule: cosine
  loss_type: huber
  scheduler_type: original
  target_snr_db: -10
  snr_mt: 10.0
  snr_curve: linear
train:
  epochs: 40
  batch_size: 32
  lr: 0.0005
  weight_decay: 1.0e-05
  grad_clip: 2.0
  warmup_frac: 0.05
  patience: 8
  amp: true
  use_cuda: true
  deterministic: true
  num_workers: 0
  ckpt_dir: checkpoints
eval:
  eval_steps:
  - 10
  - 20
  - 50
  - 100
  num_samples: 4
  recon_weight: 1.0
  eps_weight: 0.4
  channel_norm: true
  channel_agg: max
  ema_alpha: 0.3
  anomaly_ratio: 0.28
  pot_q: 0.001
  pot_level: 0.98
  result_dir: results
  seed: 2026
sic:
  enabled: false
  gaussian_kernel_size: 31
  gaussian_sigma: 5.0
  granularity: window
  min_reverse_step_ratio: 0.05
  max_reverse_step_ratio: 0.4
  ddim_steps: 8
  deterministic_noise: true
  num_samples: 1
  clip_denoised: false
score:
  denoise_weight: 1.0
  sic_weight: 0.0
  graph_weight: 0.0
  normalization: zscore
dataset:
  data_root: data/PSM
  train_file: train.csv
  test_file: test.csv
  label_file: test_label.csv
  name: PSM
