seed: 42
data:
  window_size: 100
  stride: 50
  train_ratio: 0.85
model:
  hidden_dim: 128
  num_layers: 3
  kernel_size: 5
  time_dim: 128
  node_dim: 16
  top_k: 0
  dynamic_graph: true
  groups: 8
diffusion:
  timesteps: 50
  schedule: cosine
  loss_type: l2
  scheduler_type: original
  target_snr_db: -10
  snr_mt: 10.0
  snr_curve: linear
train:
  epochs: 40
  batch_size: 16
  lr: 0.002
  weight_decay: 1.0e-06
  grad_clip: 2.0
  warmup_frac: 0.02
  patience: 8
  amp: true
  use_cuda: true
  deterministic: true
  num_workers: 0
  ckpt_dir: checkpoints
eval:
  eval_steps:
  - 5
  - 12
  - 25
  num_samples: 1
  recon_weight: 1.0
  eps_weight: 0.0
  channel_norm: true
  channel_agg: mean
  ema_alpha: 0.1
  anomaly_ratio: 0.1
  pot_q: 0.001
  pot_level: 0.98
  result_dir: results
  seed: 2026
sic:
  enabled: true
  gaussian_kernel_size: 31
  gaussian_sigma: 12.0
  granularity: window
  min_reverse_step_ratio: 0.1
  max_reverse_step_ratio: 0.2
  ddim_steps: 8
  deterministic_noise: true
  num_samples: 1
  clip_denoised: false
score:
  denoise_weight: 0.5
  sic_weight: 0.25
  graph_weight: 0.0
  normalization: zscore
dataset:
  data_root: data/MSL
  train_file: MSL_train.npy
  test_file: MSL_test.npy
  label_file: MSL_test_label.npy
  name: MSL
